[project]
name = "agy-chat"
version = "0.1.0"
description = "A work-chat client for agy-team: humans and agents in shared channels and threads."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
# agyteam is the only dependency, and its core is standard library only. A
# local checkout installed first (pip install -e ../agy-team) satisfies this.
dependencies = ["agyteam @ git+https://github.com/roelle/agy-team.git"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
agy-chat = "agychat.server:main"

[tool.setuptools.packages.find]
include = ["agychat*"]

[tool.setuptools.package-data]
agychat = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
