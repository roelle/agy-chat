[project]
name = "agy-chat"
dynamic = ["version"]
description = "A work-chat client for agy-team: humans and agents in shared channels and threads."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
# agyteam is the only dependency, and its core is standard library only. A
# local checkout installed first (pip install -e ../agy-team) satisfies this.
# Pinned to a release: agy-team follows semantic versioning from 3.0.0.
dependencies = ["agyteam @ git+https://github.com/roelle/agy-team.git@v3.4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
agy-chat = "agychat.server:main"

[tool.setuptools.dynamic]
version = {attr = "agychat.__version__"}

[tool.setuptools.packages.find]
include = ["agychat*"]

[tool.setuptools.package-data]
agychat = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
