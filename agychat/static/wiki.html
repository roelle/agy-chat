<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team wiki — agy-chat</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  body { display: block; overflow: auto; }
  .wiki { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }
  .wiki h1 { font-size: 22px; margin: 0 0 4px; }
  .wiki h2 { font-size: 16px; margin: 28px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 10px 0; }
  .card .name { font-weight: 700; margin-bottom: 4px; }
  .sub { color: var(--dim); }
</style>
</head>
<body>
<div class="wiki">
  <h1 id="title">Team wiki</h1>
  <div class="sub">The team's norms (NORMS.md) and what each agent has written to memory. Read-only.</div>
  <h2>Norms</h2>
  <div id="norms" class="card body"></div>
  <h2>Memories</h2>
  <div id="memories"></div>
</div>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function md(src) {
  return esc(src).split(/\n{2,}/).map((b) => b.startsWith("```") ? `<pre><code>${b.replace(/^```.*\n?|```$/g, "")}</code></pre>` :
    /^#{1,4} /.test(b) ? `<p><strong>${b.replace(/^#+ /, "")}</strong></p>` :
    /^\s*[-*] /m.test(b) ? `<ul>${b.split("\n").map((l) => `<li>${l.replace(/^\s*[-*] /, "")}</li>`).join("")}</ul>` :
    `<p>${b.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\n/g, "<br>")}</p>`).join("");
}
(async () => {
  const team = new URLSearchParams(location.search).get("team");
  document.getElementById("title").textContent = `${team} — team wiki`;
  const r = await fetch(`/api/wiki?team=${encodeURIComponent(team)}`); const w = await r.json();
  document.getElementById("norms").innerHTML = w.norms ? md(w.norms) : "<p class='sub'>No NORMS.md yet: the team has not adopted any norms.</p>";
  document.getElementById("memories").innerHTML = Object.entries(w.memories || {}).map(([agent, items]) =>
    `<h2>${esc(agent)} <span class="sub">${items.length} memor${items.length === 1 ? "y" : "ies"}</span></h2>` +
    (items.length ? items.map((m) => `<div class="card"><div class="name">${esc(m.name)}</div><div class="body">${md(m.content)}</div></div>`).join("")
                  : "<div class='sub'>nothing saved</div>")).join("");
})();
</script>
</body>
</html>
