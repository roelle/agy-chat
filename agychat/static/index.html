<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agy-chat</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand">agy<span>chat</span></div>
  <label class="team-label" for="team">Team</label>
  <select id="team" title="Each directory under the teams root (~/agy-teams) is a team"></select>
  <div class="search">
    <input id="search" type="search" placeholder="Search messages, tasks, norms  (Ctrl/⌘ K)" autocomplete="off">
    <div id="search-results" class="popover hidden"></div>
  </div>
  <div class="sup">
    <span id="sup-pill" class="pill">…</span>
    <button id="sup-start" class="btn small hidden">Start team</button>
    <button id="sup-restart" class="btn small ghost hidden" title="Restart on the installed code: no new turns; the ones in flight finish first">Restart</button>
    <button id="sup-stop" class="btn small ghost hidden">Stop</button>
  </div>
  <nav id="app-nav" class="app-nav"></nav>
  <div id="me" class="me"></div>

</header>

<div class="main">
  <aside class="left">
    <section class="discourse">
      <div class="section-head">Channels <button id="new-channel" class="icon" title="New channel">+</button></div>
      <ul id="channels" class="nav"></ul>
      <div class="section-head sub-head hidden" id="archived-head"><button id="archived-toggle" class="disclose">▸ Archived <span id="archived-count"></span></button></div>
      <ul id="archived" class="nav archived hidden"></ul>
      <div class="section-head">Direct messages</div>
      <ul id="dms" class="nav"></ul>
      <div class="section-head" id="pairs-head">Between agents</div>
      <ul id="pairs" class="nav"></ul>
    </section>
    <div class="splitter h" data-split="ops" title="Drag to resize; double-click to reset"></div>
    <section class="ops">
      <div class="section-head">Agents</div>
      <ul id="agents" class="agents"></ul>
      <div class="section-head">Tasks <label class="toggle"><input id="show-done" type="checkbox"> done</label></div>
      <div id="tasks" class="tasks"></div>
    </section>
  </aside>
  <div class="splitter v" data-split="left" title="Drag to resize; double-click to reset"></div>

  <section class="stream">
    <div class="stream-head">
      <div>
        <div id="view-title" class="view-title"></div>
        <div id="view-sub" class="view-sub"></div>
        <div id="view-bookmarks" class="view-bookmarks hidden"></div>
      </div>
      <div class="stream-tools">
        <label class="toggle"><input id="show-quiet" type="checkbox"> quiet updates</label>
        <button id="new-task" class="btn small ghost hidden" title="A task discussed in this channel">+ Task</button>
        <button id="view-tasks" class="btn small ghost hidden" data-panel="tasks">Tasks ▸</button>
        <button id="edit-members" class="btn small ghost hidden">Channel…</button>
        <button id="open-panel" class="btn small ghost" title="Open the side panel: this channel's tasks, threads, artifacts">Panel ▸</button>
      </div>
    </div>
    <div id="view-banner" class="banner hidden"></div>
    <div id="messages" class="messages"></div>
    <form id="composer" class="composer">
      <div id="mention-box" class="popover mention hidden"></div>
      <textarea id="input" rows="2" placeholder="Message"></textarea>
      <input id="attach-file" type="file" multiple class="hidden">
      <div class="composer-row">
        <select id="kind" title="Kind">
          <option value="work">work</option>
          <option value="question">question</option>
          <option value="blocker">blocker</option>
          <option value="fyi">fyi (never wakes)</option>
        </select>
        <button type="button" id="attach" class="icon" title="Attach a file or picture (or paste / drop one into the box)">📎</button>
        <button type="button" id="emoji" class="icon" title="Emoji (or type :name, or use your system's picker: Win+. / Ctrl+Cmd+Space)">😀</button>
        <div id="emoji-box" class="popover emoji-box hidden"></div>
        <span id="compose-hint" class="hint"></span>
        <button class="btn" type="submit">Send</button>
      </div>
    </form>
  </section>

  <div class="splitter v hidden" id="drawer-split" data-split="drawer" title="Drag to resize; double-click to reset"></div>
  <aside id="drawer" class="drawer hidden">
    <div class="drawer-head">
      <div class="tabs">
        <button data-tab="tasks" class="tab">Tasks</button>
        <button data-tab="thread" class="tab">Thread</button>
        <button data-tab="artifact" class="tab">Artifact</button>
        <button data-tab="activity" class="tab">Activity</button>
      </div>
      <button id="drawer-close" class="icon" title="Close">×</button>
    </div>
    <div id="drawer-tasks" class="drawer-body hidden"></div>
    <div id="drawer-thread" class="drawer-body"></div>
    <div id="drawer-artifact" class="drawer-body hidden"></div>
    <div id="drawer-activity" class="drawer-body hidden"></div>
  </aside>
</div>

<div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/common.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
